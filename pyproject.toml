[tool.ruff]
required-version = "==0.16.1"
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["data", "models", "outputs", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
